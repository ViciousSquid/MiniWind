name: Generate 25 new MiniWind heads

on:
  push:
    branches:
      - fix/worldwide-head-identity
    paths:
      - game/tools/create_25_heads.py
      - .github/workflows/generate-miniwind-heads.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-head-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow numpy
      - name: Generate distinct PNG heads
        run: python game/tools/create_25_heads.py
      - name: Confirm all 25 outputs are present and not identical
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          p=Path("assets/sprites/heads")
          files=[p/f"head{i}.png" for i in range(162,187)]
          assert all(x.exists() for x in files), "Missing PNGs"
          pixels=[]
          for f in files:
              with Image.open(f) as im:
                  assert im.mode == "RGBA", f
                  assert im.size[0] == im.size[1], f
                  pixels.append(hashlib.sha256(im.tobytes()).digest())
          assert len(set(pixels)) == 25, "Two new heads share an image"
          print("Validated", len(files), "unique square RGBA heads")
          PY
      - name: Commit generated PNGs to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sprites/heads/head{162..186}.png
          if ! git diff --cached --quiet; then
            git commit -m "Add 25 distinct NPC head PNG assets (head162-head186)"
            git push
          fi
