name: Windows x64 Console Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build MiniWind for Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.14 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: "x64"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nuitka

      - name: Build standalone executable (console visible)
        run: |
          python -m nuitka main.py `
            --standalone `
            --enable-plugin=pyqt5 `
            --windows-console-mode=force `
            --assume-yes-for-downloads `
            --output-dir=build `
            --output-filename=MiniWind.exe `
            --include-data-dir=assets=assets `
            --include-data-dir=engine=engine `
            --include-data-dir=editor=editor `
            --include-data-dir=plugins=plugins `
            --include-data-dir=game=game `
            --include-data-dir=maps=maps `
            --include-data-dir=tools=tools `
            --include-data-dir=tests=tests `
            --include-data-files=settings.ini=settings.ini `
            --include-data-files=editor/version.txt=editor/version.txt

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "build/main.dist/MiniWind.exe")) {
            throw "Nuitka did not produce build/main.dist/MiniWind.exe"
          }

      - name: Upload Windows x64 build
        uses: actions/upload-artifact@v4
        with:
          name: MiniWind-Windows-x64-console
          path: build/main.dist/
          if-no-files-found: error
          retention-days: 14
