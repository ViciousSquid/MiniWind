name: MiniWind Windows Build

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Validate required files
        shell: pwsh
        run: |
          $required = @(
            "main.py",
            "assets/icon.ico",
            "requirements.txt"
          )

          foreach ($file in $required) {
            if (Test-Path $file) {
              Write-Host "Found: $file"
            } else {
              Write-Error "Missing required file: $file"
              exit 1
            }
          }

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install nuitka zstandard

      - name: Build with Nuitka
        run: |
          python -m nuitka `
            --standalone `
            --output-filename=MiniWind `
            --assume-yes-for-downloads `
            --plugin-enable=pyqt5 `
            --include-qt-plugins=sensible,platforms,styles,imageformats `
            --include-package=engine `
            --include-package=editor `
            --include-package=game `
            --include-package=PIL `
            --include-package=plugins `
            --include-package-data=plugins `
            --include-data-dir=assets=assets `
            --include-data-dir=game=game `
            --include-data-dir=tools=tools `
            --include-data-dir=maps=maps `
            --include-data-files=settings.ini=settings.ini `
            --include-data-files=editor/version.txt=editor/version.txt `
            --windows-icon-from-ico=assets/icon.ico `
            --windows-console-mode=disable `
            --output-dir=build `
            main.py

      - name: Validate Windows build
        shell: pwsh
        run: |
          $dist = "build/main.dist"

          if (Test-Path "$dist/MiniWind.exe") {
            Write-Host "Build successful - MiniWind.exe found"
          } else {
            Write-Error "Build failed: MiniWind.exe not found"
            exit 1
          }

          if (Test-Path "$dist/game") {
            Write-Host "Game directory found in distribution"
          } else {
            Write-Error "Build failed: game directory not found"
            exit 1
          }

          if (Test-Path "$dist/assets") {
            Write-Host "Assets directory found in distribution"
          } else {
            Write-Error "Build failed: assets directory not found"
            exit 1
          }

          Write-Host ""
          Write-Host "MiniWind distribution:"
          Get-ChildItem $dist -Recurse | Select-Object FullName

      - uses: actions/upload-artifact@v4
        with:
          name: MiniWind-windows
          path: build/main.dist/
