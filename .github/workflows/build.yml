  create-release:
    name: Create GitHub Release
    needs:
      - build-windows
      - build-macos
      - build-linux
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: fio-windows
          path: release/Fio-Windows

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: fio-macos
          path: release

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: fio-linux
          path: release/Fio-Linux

      - name: Package Windows and Linux builds
        shell: bash
        run: |
          cd release

          zip -r Fio-Windows.zip Fio-Windows
          zip -r Fio-Linux.zip Fio-Linux

          rm -rf Fio-Windows Fio-Linux

          ls -lh

      - name: Determine release version
        id: version
        shell: bash
        run: |
          VERSION=$(cat ../editor/version.txt | tr -d '\r\n')

          if [ -z "$VERSION" ]; then
            echo "Could not determine Fio version"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Fio version: $VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Fio ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            release/Fio-Windows.zip
            release/Fio-macOS.zip
            release/Fio-Linux.zip
