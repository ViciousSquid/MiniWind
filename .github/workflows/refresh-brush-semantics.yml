name: Refresh brush semantics fixtures (one-time)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-brush-semantics.yml"

permissions:
  contents: write

jobs:
  refresh-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Regenerate the brush semantics and write-site baselines
        run: python tools/brush_semantics_snapshot.py --write
      - name: Commit the reviewed current baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/brush_model/semantics_snapshot.json tests/brush_model/write_sites.json
          git commit -m "Tests: refresh brush semantics baseline for the v5 world"
          git push origin HEAD:main
