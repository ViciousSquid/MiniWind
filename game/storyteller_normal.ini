# MiniWind -- storyteller_normal.ini
#
# The storyteller, in both game modes. It paces what the world already
# holds: it samples and biases journeys, destinations and grudges that exist,
# and never makes anything up. Settings switched on here win over the code
# and over game/data/storyteller.json (and mods). A loaded save keeps the
# levers it was saved with until its next state change (or a reload).
# Dynamic mode's director is tuned in storyteller_dynamic.ini.
# See docs/storyteller.md and docs/game_modes.md.
#
# Every setting is listed with the value the game uses now, switched off by
# the ';' in front of it. Delete the ';' to make a setting yours, then change
# its value. A value that cannot be read is skipped and reported.
#
# Read when the game starts and each time Play starts. In Play, the console
# command `storyteller reload` applies an edit at once.
#
# Units: world units (a player is about 64 tall); game hours (one game hour
# is a real minute at the usual clock); real seconds where it says seconds.

[storyteller]
# false = pristine ecology: no pacing, no overrides or biases
;enabled = true
# game hours between the storyteller's samples
;sample_hours = 0.25
# health fraction at which the player counts as healthy
;healthy = 0.7
# health fraction below which the player is in danger
;danger_health = 0.35
# tension at which RISING may crest into PEAK
;peak_tension = 0.65
# tension below which RESPITE may end
;recovered_tension = 0.25
# tension one attack on the player adds
;attack_tension = 0.18
# tension a death adds
;death_tension = 1
# tension each visible hostile adds
;hostile_tension = 0.08
# bounty at which law pressure counts toward rising
;pressure_bounty = 150
# world units: how far the storyteller counts visible hostiles
;sight_radius = 1800
# world units: how near a justified journey must be to be weighted
;staging_distance = 900
# world units: the furthest a grudge-holder's market trip is redirected
;vendetta_trip_distance = 6000
# game hours over which hostile arrivals are counted
;arrival_window_hours = 2
# game hours an unpaid writ waits before hunters come cheaper
;unpaid_writ_hours = 24
# how strongly the player's wealth draws brigands
;prosperity_bandit_bias = 2
# how strongly the player's notoriety lowers the hunter bounty
;notoriety_hunter_scale = 0.5
# entries kept in the activity feed
;activity_cap = 40
# samples kept in the observation history
;observation_cap = 10

[justified journeys]
# how strongly each kind of grudge draws its holder's trip toward the player
# (share of the state's vendetta_bias; 0 = an ordinary trip)
;vendetta = 1
;reckoning = 1
;restitution = 0.5
;gratitude = 0.5

[CALM]
# Quiet roads give existing troubles time to develop.
# next: RISING
# game hours the state lasts at least
;min_hours = 3
# game hours it lasts at most (none = no limit)
;max_hours = 8
# parties on the roads
;population = 26
# bounty at which bounty hunters set out
;hunter_bounty = 150
# multiplier on how long a cleared lair takes to refill
;lair_refill_scale = 1
# chance (0-1) a townsperson walks to market
;market_chance = 0.25
# how strongly remembered crimes draw trips to a town
;destination_bias = 2
# how strongly a grudge draws its holder toward the player
;vendetta_bias = 1
# hunter bounty multiplier once a writ is old
;writ_hunter_scale = 0.75
# road party weights (0 = none set out); unset kinds use their usual weight:
# trader 6, caravan 3, pilgrims 3, adventurers 4, patrol 3, courier 3, minstrel 1, bandits 3, wolves 1, greenskins 1, hunters 0, market 0, faction_raid 0
;weight.bandits = 2
;weight.wolves = 1
;weight.greenskins = 1
# hours a party kind sets out (from-until, may cross midnight); unset kinds
# use their usual hours, e.g. hours.bandits = 17-24

[RISING]
# More hostile departures after dark bring existing trouble closer.
# next: PEAK
# game hours the state lasts at least
;min_hours = 2
# game hours it lasts at most (none = no limit)
;max_hours = 6
# parties on the roads
;population = 30
# bounty at which bounty hunters set out
;hunter_bounty = 125
# multiplier on how long a cleared lair takes to refill
;lair_refill_scale = 0.85
# chance (0-1) a townsperson walks to market
;market_chance = 0.2
# how strongly remembered crimes draw trips to a town
;destination_bias = 4
# how strongly a grudge draws its holder toward the player
;vendetta_bias = 4
# hunter bounty multiplier once a writ is old
;writ_hunter_scale = 0.75
# road party weights (0 = none set out); unset kinds use their usual weight:
# trader 6, caravan 3, pilgrims 3, adventurers 4, patrol 3, courier 3, minstrel 1, bandits 3, wolves 1, greenskins 1, hunters 0, market 0, faction_raid 0
;weight.bandits = 6
;weight.wolves = 3
;weight.greenskins = 3
# hours a party kind sets out (from-until, may cross midnight); unset kinds
# use their usual hours, e.g. hours.bandits = 17-24
;hours.bandits = 18-6
;hours.wolves = 19-6
;hours.greenskins = 20-5

[PEAK]
# A short crest lets consequences play out before easing the roads.
# next: RESPITE
# game hours the state lasts at least
;min_hours = 0.5
# game hours it lasts at most (none = no limit)
;max_hours = 2
# parties on the roads
;population = 30
# bounty at which bounty hunters set out
;hunter_bounty = 125
# multiplier on how long a cleared lair takes to refill
;lair_refill_scale = 0.85
# chance (0-1) a townsperson walks to market
;market_chance = 0.15
# how strongly remembered crimes draw trips to a town
;destination_bias = 5
# how strongly a grudge draws its holder toward the player
;vendetta_bias = 6
# hunter bounty multiplier once a writ is old
;writ_hunter_scale = 0.75
# road party weights (0 = none set out); unset kinds use their usual weight:
# trader 6, caravan 3, pilgrims 3, adventurers 4, patrol 3, courier 3, minstrel 1, bandits 3, wolves 1, greenskins 1, hunters 0, market 0, faction_raid 0
;weight.bandits = 5
;weight.wolves = 2
;weight.greenskins = 2
# hours a party kind sets out (from-until, may cross midnight); unset kinds
# use their usual hours, e.g. hours.bandits = 17-24
;hours.bandits = 18-6
;hours.wolves = 19-6
;hours.greenskins = 20-5

[RESPITE]
# Gentler traffic gives the player room to recover.
# next: CALM
# game hours the state lasts at least
;min_hours = 4
# game hours it lasts at most (none = no limit)
;max_hours = none
# parties on the roads
;population = 24
# bounty at which bounty hunters set out
;hunter_bounty = 300
# multiplier on how long a cleared lair takes to refill
;lair_refill_scale = 1.5
# chance (0-1) a townsperson walks to market
;market_chance = 0.5
# how strongly remembered crimes draw trips to a town
;destination_bias = 1.5
# how strongly a grudge draws its holder toward the player
;vendetta_bias = 1
# hunter bounty multiplier once a writ is old
;writ_hunter_scale = 0.75
# road party weights (0 = none set out); unset kinds use their usual weight:
# trader 6, caravan 3, pilgrims 3, adventurers 4, patrol 3, courier 3, minstrel 1, bandits 3, wolves 1, greenskins 1, hunters 0, market 0, faction_raid 0
;weight.bandits = 1
;weight.wolves = 0
;weight.greenskins = 0
;weight.trader = 10
;weight.caravan = 5
;weight.minstrel = 5
# hours a party kind sets out (from-until, may cross midnight); unset kinds
# use their usual hours, e.g. hours.bandits = 17-24
