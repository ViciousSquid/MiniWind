# MiniWind -- storyteller_dynamic.ini
#
# Dynamic game mode's director only: it stages scenes on the roads, cast from
# the world's own people and grudges (game/living/scenarios.py). Normal mode
# ignores this file. See docs/game_modes.md.
#
# The director also learns: it nudges the time between scenes, how often
# hostile scenes come and how often each scene is picked, in small steps
# within the limits in [learning], and explains every nudge. What it learns
# lives in the save, on top of the values here.
#
# Every setting is listed with the value the game uses now, switched off by
# the ';' in front of it. Delete the ';' to make a setting yours, then change
# its value. A value that cannot be read is skipped and reported.
#
# Read when the game starts and each time Play starts. In Play, the console
# command `storyteller reload` applies an edit at once.
#
# Units: world units (a player is about 64 tall); game hours (one game hour
# is a real minute at the usual clock); real seconds where it says seconds.

[director]
# tension (0-1) at which build-up stops and the peak is held
;peak = 0.8
# tension below which easing off may become a rest
;relax_below = 0.25
# real seconds the peak is held (min-max)
;sustain_seconds = 8-15
# real seconds a rest lasts (min-max)
;relax_seconds = 60-120
# real seconds of rest when a session starts
;first_relax = 40
# real seconds between scenes while building (min-max)
;build_gap = 45-90
# tension per whole health bar lost
;damage_gain = 2.5
# tension per second for each hostile fighting near the player
;engaged_gain = 0.02
# tension lost per second when calm
;calm_decay = 0.04
# tension lost per second while threatened
;tense_decay = 0.01
# world units: hostiles nearer than this raise tension
;threat_radius = 1500
# health fraction below which no new threats are staged
;hurt = 0.45
# most scenes in play at once
;max_scenes = 2
# world units: scenes are staged at least this far ahead
;stage_min = 1150
# world units: and no further than this
;stage_max = 1900
# world units: how near a road the player must be
;on_road = 900
# world units: hostile scenes keep this far from towns
;town_clear = 900
# world units: how far beyond an avenger their quarry waits
;quarry_gap = 750
# game hours a staged party waits before the world moves on
;hold_hours = 3
# game hours before an unbroken cult rite is finished
;rite_hours = 2.5
# world units: the hint line shows from this near
;hint_radius = 1300
# world units: a rescued party thanks the player from this near
;thank_radius = 380
# game days a grievance can still send an avenger out
;grievance_days = 10

[scene weights]
# how often each scene is picked against the others that fit the moment
# someone grateful to the player (also in rests)
;gratitude = 4
# a traveller set upon by brigands
;waylaid = 3
# a townsperson out for revenge
;avenger = 3
# someone settling a score with the player
;reckoning = 3
# the watch fighting brigands
;patrol = 1.5
# a cult rite with a captive (night only)
;cult_rite = 3
# brigands lying in wait (night; half as likely at dusk)
;ambush = 2
# a cult procession (night only)
;procession = 1.5

[storyteller states]
# how the storyteller's state scales the director:
# gap = the time between scenes, hostile = how often hostile scenes are picked
;gap.CALM = 1
;hostile.CALM = 1
;gap.RISING = 0.8
;hostile.RISING = 1.3
;gap.PEAK = 0.7
;hostile.PEAK = 1.5
;gap.RESPITE = 1.6
;hostile.RESPITE = 0.4

[learning]
# how the director tunes itself to the player, a small step at a time
# false = the director never learns and uses this file's values as they are
;enabled = true
# how far one nudge moves the pace (the gap and hostile scales below)
;step = 0.1
# how much a scene gains each time the player steps into one
;scene_step_up = 0.05
# how much it loses each time the player passes one by
;scene_step_down = 0.1
# the time between scenes never drops below this share of build_gap
;gap_min = 0.6
# nor rises above this share
;gap_max = 1.8
# hostile scenes are never picked less than this share as often
;hostile_min = 0.5
# nor more than this share
;hostile_max = 1.5
# no scene is ever picked less than this share as often
;scene_min = 0.4
# nor more than this share
;scene_max = 2
# a peak that left the player below this health was too hard
;overwhelmed_health = 0.3
# a peak the player came through above this health was too easy
;breezed_health = 0.8
